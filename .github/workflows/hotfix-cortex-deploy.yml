# Hotfix: deploy Cortex to Hetzner k3s only (no tests, no other apps)
name: Hotfix Cortex Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type hotfix to confirm deploy to production'
        required: true
        default: 'hotfix'

jobs:
  hotfix-cortex:
    name: Hotfix deploy to Hetzner (cortex only)
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'hotfix'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Hetzner Kubernetes
        run: |
          echo "=== Cortex hotfix deploy (skip CI tests) ==="

          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_PRIVATE_KEY }}" > ~/.ssh/hetzner_key
          chmod 600 ~/.ssh/hetzner_key
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

          SSH_OPTS="-i ~/.ssh/hetzner_key -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=3 -o ConnectTimeout=30"

          tar --exclude='.git' --exclude='venv' --exclude='venv-prod' --exclude='__pycache__' --exclude='*.pyc' \
              --exclude='.env' --exclude='chroma_db' --exclude='uploads' --exclude='*.db' --exclude='*.sqlite*' \
              --exclude='logs' --exclude='data' -czf /tmp/cortex-source.tar.gz .

          scp $SSH_OPTS /tmp/cortex-source.tar.gz root@${{ secrets.HETZNER_HOST }}:/tmp/
          rm -f /tmp/cortex-source.tar.gz

          scp $SSH_OPTS scripts/hotfix_cortex_remote.sh root@${{ secrets.HETZNER_HOST }}:/tmp/hotfix_cortex_remote.sh
          ssh $SSH_OPTS root@${{ secrets.HETZNER_HOST }} "chmod +x /tmp/hotfix_cortex_remote.sh && /tmp/hotfix_cortex_remote.sh"

      - name: Verify public health
        run: |
          sleep 5
          curl -sf ${{ secrets.HETZNER_APP_URL || 'https://cortex.janisrael.com' }}/health
          curl -sf ${{ secrets.HETZNER_APP_URL || 'https://cortex.janisrael.com' }}/static/v2/js/dashboard-core.js | grep -q invalidateChatbotConfigCache